name: app
# iOS app build + tests on macOS (10x minutes — lean and batched).
# Triggered by app-layer changes or manually (workflow_dispatch).
on:
  push:
    branches: ['**']
    paths:
      - 'apps/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/OrbitApp
        run: xcodegen generate

      - name: Build (iOS Simulator)
        working-directory: apps/OrbitApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project OrbitApp.xcodeproj \
            -scheme OrbitApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -40

      - name: Unit + view-model tests
        working-directory: apps/OrbitApp
        run: |
          set -o pipefail
          xcodebuild test \
            -project OrbitApp.xcodeproj \
            -scheme OrbitApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO | tail -60
