# XcodeGen spec — the app project is GENERATED, never committed (D-10 spirit:
# one source of truth; .xcodeproj drift can't happen if it doesn't exist).
# CI runs `xcodegen generate` (see .github/workflows/app.yml).
name: OrbitApp
options:
  bundleIdPrefix: dev.abdoul.orbit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Orbit:
    path: ../..

targets:
  OrbitDesign:
    type: framework
    platform: iOS
    sources: [Sources/OrbitDesign]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

  OrbitApp:
    type: application
    platform: iOS
    sources: [Sources/OrbitApp]
    dependencies:
      - target: OrbitDesign
      - package: Orbit
        product: OrbitCore
      - package: Orbit
        product: OrbitSQLite
      - package: Orbit
        product: OrbitStore
      - package: Orbit
        product: OrbitWrite
      - package: Orbit
        product: OrbitPipeline
      - package: Orbit
        product: OrbitRecall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: >-
          Orbit records your voice memos on this device. Audio never leaves
          your phone and is deleted once transcribed.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  OrbitAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/OrbitAppTests]
    dependencies:
      - target: OrbitApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

  OrbitAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/OrbitAppUITests]
    dependencies:
      - target: OrbitApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  OrbitApp:
    build:
      targets:
        OrbitApp: all
    test:
      gatherCoverageData: false
      targets:
        - OrbitAppTests
        - OrbitAppUITests
